<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#140f28">
  <title>Tetris Adventure</title>

  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; min-height:100%; background:#100b20; color:#fff; font-family:Arial,sans-serif; }
    body { min-height:100dvh; display:flex; justify-content:center; align-items:flex-start; overflow-x:hidden; overflow-y:auto; padding: max(8px, env(safe-area-inset-top)) 8px max(12px, env(safe-area-inset-bottom)); }
    #game-container { width:min(100%, 500px); margin:0 auto; text-align:center; }
    .topbar { width:100%; min-height:54px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 2px 8px; }
    .brand { text-align:left; font-size:clamp(15px,4vw,19px); font-weight:800; letter-spacing:.7px; color:#fff; }
    .brand small { display:block; margin-top:3px; font-size:10px; font-weight:500; color:#bdb5d2; letter-spacing:1.4px; }
    .identity { display:flex; align-items:center; gap:7px; max-width:62%; padding:5px 8px 5px 5px; border:1px solid rgba(190,170,255,.35); border-radius:999px; background:rgba(39,29,68,.92); text-align:left; }
    .identity img { width:34px; height:34px; border-radius:50%; object-fit:cover; border:2px solid #d6c7ff; flex:none; }
    .identity .who { min-width:0; font-size:10px; line-height:1.25; font-weight:700; white-space:nowrap; }
    .identity .nim { display:block; color:#c5b8e8; font-size:9px; font-weight:500; margin-top:2px; }
    #canvas-wrap { width:100%; display:flex; justify-content:center; }
    canvas { display:block; width:100% !important; height:auto !important; max-width:500px; margin:0 auto; touch-action:none; border:1px solid rgba(177,151,255,.2); border-radius:10px; }
    .mobile-controls { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; width:100%; margin:9px auto 0; touch-action:manipulation; }
    .mobile-controls button, .action-row button { min-height:48px; border:1px solid #7460a9; border-radius:12px; background:linear-gradient(180deg,#39295e,#24183f); color:white; font-size:19px; font-weight:700; box-shadow:0 3px 0 #160f2a; touch-action:none; user-select:none; -webkit-user-select:none; }
    .mobile-controls button:active, .action-row button:active { transform:translateY(2px); box-shadow:0 1px 0 #160f2a; background:#594184; }
    .mobile-controls button span { display:block; font-size:9px; font-weight:500; color:#c9bee2; margin-top:2px; }
    .action-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
    .action-row button { min-height:42px; font-size:13px; }
    .note { color:#bdb5d2; font-size:10px; line-height:1.4; margin:8px 0 2px; }
    @media (min-width:600px) { body { align-items:center; } #game-container { max-width:500px; } }
  </style>

  <!-- Library p5.js -->
  <script>
  function loadP5(url, fallback) {
    const script = document.createElement("script");
    script.src = url;

    script.onerror = function () {
      if (fallback) {
        loadP5(fallback, null);
      } else {
        document.body.innerHTML =
          "<h2>Gagal memuat p5.js</h2><p>Periksa koneksi internet kamu.</p>";
      }
    };

    document.head.appendChild(script);
  }

  loadP5(
    "https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"
  );
</script>
</head>

    <div id="canvas-wrap"></div>
    <section class="mobile-controls" aria-label="Kontrol permainan">
      <button type="button" data-action="left">◀<span>KIRI</span></button>
      <button type="button" data-action="down">▼<span>TURUN</span></button>
      <button type="button" data-action="rotate">↻<span>PUTAR</span></button>
      <button type="button" data-action="right">▶<span>KANAN</span></button>
      <button type="button" data-action="drop">⬇⬇<span>JATUHKAN</span></button>
    </section>
    <div class="action-row">
      <button type="button" id="start-btn">MULAI GAME</button>
      <button type="button" id="restart-btn">ULANGI GAME</button>

    <p class="note">Geser balok dengan tombol di layar. Putar untuk mengubah arah, dan Jatuhkan untuk menjatuhkan balok langsung.</p>
  </main>

  <script>
    // =====================================
    // DATA BENTUK BALOK (SHAPES.JS)
    // =====================================

    function getShapes() {
      return [
        { shape: [[1, 1], [1, 1]], color: [255, 220, 0] },
        { shape: [[1, 1, 1, 1]], color: [0, 200, 255] },
        { shape: [[1, 0, 0], [1, 1, 1]], color: [255, 140, 0] },
        { shape: [[0, 0, 1], [1, 1, 1]], color: [160, 80, 255] },
        { shape: [[0, 1, 1], [1, 1, 0]], color: [0, 220, 100] },
        { shape: [[1, 1, 0], [0, 1, 1]], color: [255, 70, 90] },
        { shape: [[0, 1, 0], [1, 1, 1]], color: [255, 100, 180] }
      ];
    }


    // =====================================
    // EFEK PARTIKEL (EFFECTS.JS)
    // =====================================

    let particles = [];

    function createEffect(x, y, color) {
      for (let i = 0; i < 5; i++) {
        particles.push({
          x: x,
          y: y,
          speedX: random(-3, 3),
          speedY: random(-3, 3),
          size: random(3, 7),
          color: [...color],
          life: 255
        });
      }
    }

    function updateEffects() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];

        p.x += p.speedX;
        p.y += p.speedY;
        p.life -= 5;

        noStroke();
        fill(p.color[0], p.color[1], p.color[2], p.life);
        circle(p.x, p.y, p.size);

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function clearEffects() {
      particles = [];
    }


    // =====================================
    // VARIABEL PERMAINAN
    // =====================================

    const COLS = 10;
    const ROWS = 20;
    const CELL = 30;
    const BOARD_X = 100;
    const BOARD_Y = 75;

    let board = [];
    let pieces = [];
    let currentPiece = null;

    let score = 0;
    let level = 1;
    let gameOver = false;
    let started = false;

    let dropInterval = 700;
    let lastDropTime = 0;

    let riseInterval = 12000;
    let lastRiseTime = 0;


    // =====================================
    // 1. PRELOAD
    // =====================================

    function preload() {
      pieces = getShapes();
    }


    // =====================================
    // 2. SETUP
    // =====================================

    function setup() {
      const canvas = createCanvas(500, 750);
      canvas.parent("canvas-wrap");

      createBoard();
      textFont("Arial");
    }


    // =====================================
    // MEMBUAT PAPAN
    // =====================================

    function createBoard() {
      board = [];

      for (let y = 0; y < ROWS; y++) {
        let row = [];

        for (let x = 0; x < COLS; x++) {
          row.push(0);
        }

        board.push(row);
      }
    }


    // =====================================
    // 3. DRAW
    // =====================================

    function draw() {
      background(20, 15, 40);

      drawBoard();
      updateEffects();

      if (!started) {
        drawStartScreen();
        return;
      }

      if (!gameOver && currentPiece) {
        if (millis() - lastDropTime >= dropInterval) {
          moveDown();
          lastDropTime = millis();
        }

        if (!gameOver && millis() - lastRiseTime >= riseInterval) {
          riseBlocks();
          lastRiseTime = millis();
        }

        level = Math.floor(score / 500) + 1;
        dropInterval = Math.max(150, 700 - (level - 1) * 60);
        riseInterval = Math.max(4000, 12000 - (level - 1) * 1000);

        if (!gameOver) {
          drawPiece();
        }
      }

      drawInformation();

      if (gameOver) {
        drawGameOver();
      }
    }


    // =====================================
    // LAYAR START
    // =====================================

    function drawStartScreen() {
      fill(0, 0, 0, 215);
      noStroke();
      rect(65, 260, 370, 190, 12);

      fill(255, 220, 0);
      textAlign(CENTER);
      textSize(25);
      text("SPACE ADVENTURE", width / 2, 305);

      fill(255);
      textSize(16);
      text("Survive the Rising Blocks!", width / 2, 345);

      textSize(18);
      text("Tap MULAI GAME below", width / 2, 395);

      textSize(12);
      text("Use the touch buttons below", width / 2, 425);
    }


    // =====================================
    // INFORMASI PERMAINAN
    // =====================================

    function drawInformation() {
      fill(255);
      noStroke();
      textAlign(LEFT);
      textSize(18);

      text("Score: " + score, 100, 700);
      text("Level: " + level, 280, 700);

      fill(190);
      textAlign(CENTER);
      textSize(12);

      text("TOUCH CONTROLS AVAILABLE BELOW", width / 2, 728);
    }


    // =====================================
    // MEMBUAT BALOK BARU
    // =====================================

    function newPiece() {
      if (pieces.length === 0) {
        gameOver = true;
        return;
      }

      const selected = random(pieces);

      currentPiece = {
        shape: selected.shape.map(row => [...row]),
        color: [...selected.color],
        x: 3,
        y: 0
      };

      if (collision(0, 0, currentPiece.shape)) {
        gameOver = true;
      }
    }


    // =====================================
    // MENGGAMBAR PAPAN
    // =====================================

    function drawBoard() {
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (board[y][x] !== 0) {
            fill(...board[y][x]);
          } else {
            fill(35, 30, 55);
          }

          stroke(75, 65, 100);
          rect(
            BOARD_X + x * CELL,
            BOARD_Y + y * CELL,
            CELL,
            CELL
          );
        }
      }
    }


    // =====================================
    // MENGGAMBAR BALOK AKTIF
    // =====================================

    function drawPiece() {
      if (!currentPiece) return;

      fill(...currentPiece.color);
      stroke(255);

      for (let y = 0; y < currentPiece.shape.length; y++) {
        for (let x = 0; x < currentPiece.shape[y].length; x++) {
          if (currentPiece.shape[y][x] === 1) {
            rect(
              BOARD_X + (currentPiece.x + x) * CELL,
              BOARD_Y + (currentPiece.y + y) * CELL,
              CELL,
              CELL
            );
          }
        }
      }
    }


    // =====================================
    // CEK TABRAKAN
    // =====================================

    function collision(offsetX, offsetY, shape) {
      if (!currentPiece) return true;

      for (let y = 0; y < shape.length; y++) {
        for (let x = 0; x < shape[y].length; x++) {
          if (shape[y][x] !== 1) continue;

          const newX = currentPiece.x + x + offsetX;
          const newY = currentPiece.y + y + offsetY;

          if (newX < 0 || newX >= COLS || newY >= ROWS) {
            return true;
          }

          if (newY >= 0 && board[newY][newX] !== 0) {
            return true;
          }
        }
      }

      return false;
    }


    // =====================================
    // GERAK KE BAWAH
    // =====================================

    function moveDown() {
      if (gameOver || !currentPiece) return;

      if (!collision(0, 1, currentPiece.shape)) {
        currentPiece.y++;
      } else {
        lockPiece();
        clearLines();

        if (!gameOver) {
          newPiece();
        }
      }
    }


    // =====================================
    // MENYIMPAN BALOK
    // =====================================

    function lockPiece() {
      for (let y = 0; y < currentPiece.shape.length; y++) {
        for (let x = 0; x < currentPiece.shape[y].length; x++) {
          if (currentPiece.shape[y][x] !== 1) continue;

          const boardY = currentPiece.y + y;
          const boardX = currentPiece.x + x;

          if (boardY < 0) {
            gameOver = true;
          } else if (boardY < ROWS && boardX >= 0 && boardX < COLS) {
            board[boardY][boardX] = [...currentPiece.color];
          }
        }
      }
    }


    // =====================================
    // MENGHAPUS BARIS PENUH
    // =====================================

    function clearLines() {
      let cleared = 0;

      for (let y = ROWS - 1; y >= 0; y--) {
        let full = true;

        for (let x = 0; x < COLS; x++) {
          if (board[y][x] === 0) {
            full = false;
            break;
          }
        }

        if (full) {
          for (let x = 0; x < COLS; x++) {
            createEffect(
              BOARD_X + x * CELL + CELL / 2,
              BOARD_Y + y * CELL + CELL / 2,
              board[y][x]
            );
          }

          board.splice(y, 1);

          let emptyRow = [];
          for (let x = 0; x < COLS; x++) {
            emptyRow.push(0);
          }

          board.unshift(emptyRow);
          cleared++;
          y++;
        }
      }

      if (cleared > 0) {
        score += cleared * 100;
      }
    }


    // =====================================
    // RISING BLOCKS
    // =====================================

    function riseBlocks() {
      for (let x = 0; x < COLS; x++) {
        if (board[0][x] !== 0) {
          gameOver = true;
          return;
        }
      }

      board.shift();

      let newRow = [];
      const hole = Math.floor(random(COLS));

      for (let x = 0; x < COLS; x++) {
        if (x === hole) {
          newRow.push(0);
        } else {
          newRow.push([100, 80, 150]);
        }
      }

      board.push(newRow);

      if (currentPiece && collision(0, 0, currentPiece.shape)) {
        gameOver = true;
      }
    }


    // =====================================
    // PUTAR KE KANAN
    // =====================================

    function rotateRight() {
      const rotated = currentPiece.shape[0].map((_, i) =>
        currentPiece.shape.map(row => row[i]).reverse()
      );

      tryRotate(rotated);
    }


    // =====================================
    // PUTAR KE KIRI
    // =====================================

    function rotateLeft() {
      const rotated = currentPiece.shape[0].map((_, i) =>
        currentPiece.shape.map(row => row[row.length - 1 - i])
      );

      tryRotate(rotated);
    }


    // =====================================
    // CEK POSISI SAAT MEMUTAR
    // =====================================

    function tryRotate(rotated) {
      const offsets = [0, -1, 1, -2, 2];

      for (const offset of offsets) {
        if (!collision(offset, 0, rotated)) {
          currentPiece.shape = rotated;
          currentPiece.x += offset;
          return;
        }
      }
    }


    // =====================================
    // BALIK HORIZONTAL
    // =====================================

    function flipHorizontal() {
      const flipped = currentPiece.shape.map(row => [...row].reverse());

      if (!collision(0, 0, flipped)) {
        currentPiece.shape = flipped;
      }
    }


    // =====================================
    // BALIK VERTIKAL
    // =====================================

    function flipVertical() {
      const flipped = [...currentPiece.shape].reverse().map(row => [...row]);

      if (!collision(0, 0, flipped)) {
        currentPiece.shape = flipped;
      }
    }


    // =====================================
    // JATUHKAN BALOK LANGSUNG
    // =====================================

    function hardDrop() {
      if (gameOver || !currentPiece) return;

      // Perulangan dibatasi maksimal ROWS langkah.
      for (let i = 0; i < ROWS; i++) {
        if (collision(0, 1, currentPiece.shape)) {
          break;
        }

        currentPiece.y++;
      }

      lockPiece();
      clearLines();

      if (!gameOver) {
        newPiece();
      }

      lastDropTime = millis();
    }


    // =====================================
    // GAME OVER
    // =====================================

    function drawGameOver() {
      fill(0, 0, 0, 220);
      noStroke();
      rect(65, 275, 370, 165, 12);

      fill(255, 65, 75);
      textAlign(CENTER);
      textSize(32);
      text("GAME OVER", width / 2, 325);

      fill(255);
      textSize(18);
      text("Final Score: " + score, width / 2, 365);

      textSize(15);
      text("Press R to Restart", width / 2, 405);
    }


    // =====================================
    // RESTART GAME
    // =====================================

    function restartGame() {
      createBoard();

      score = 0;
      level = 1;
      gameOver = false;
      started = true;
      currentPiece = null;

      dropInterval = 700;
      riseInterval = 12000;

      lastDropTime = millis();
      lastRiseTime = millis();

      clearEffects();
      newPiece();
    }


    // =====================================
    // KONTROL KEYBOARD
    // =====================================

    function keyPressed() {
      if (!started && keyCode === ENTER) {
        started = true;
        gameOver = false;
        newPiece();

        lastDropTime = millis();
        lastRiseTime = millis();

        return false;
      }

      if (gameOver) {
        if (key === "r" || key === "R") {
          restartGame();
        }

        return false;
      }

      if (!started || !currentPiece) return false;

      if (keyCode === LEFT_ARROW) {
        if (!collision(-1, 0, currentPiece.shape)) {
          currentPiece.x--;
        }
      } else if (keyCode === RIGHT_ARROW) {
        if (!collision(1, 0, currentPiece.shape)) {
          currentPiece.x++;
        }
      } else if (keyCode === DOWN_ARROW) {
        moveDown();
        lastDropTime = millis();
      } else if (keyCode === UP_ARROW) {
        rotateRight();
      } else if (key === "q" || key === "Q") {
        rotateLeft();
      } else if (key === "x" || key === "X") {
        flipHorizontal();
      } else if (key === "z" || key === "Z") {
        flipVertical();
      } else if (key === " ") {
        hardDrop();
      }

      return false;
    }


    // =====================================
    // KONTROL SENTUH ANDROID
    // =====================================
    function startFromTouch() {
      if (gameOver) { restartGame(); return; }
      if (!started) {
        started = true;
        gameOver = false;
        newPiece();
        lastDropTime = millis();
        lastRiseTime = millis();
      }
    }
    function mobileAction(action) {
      if (!started) { startFromTouch(); return; }
      if (gameOver) return;
      if (!currentPiece) return;
      if (action === 'left' && !collision(-1, 0, currentPiece.shape)) currentPiece.x--;
      else if (action === 'right' && !collision(1, 0, currentPiece.shape)) currentPiece.x++;
      else if (action === 'down') { moveDown(); lastDropTime = millis(); }
      else if (action === 'rotate') rotateRight();
      else if (action === 'drop') hardDrop();
    }
    document.querySelectorAll('[data-action]').forEach(button => {
      const action = button.dataset.action;
      let repeatTimer = null;
      const press = (event) => {
        event.preventDefault();
        mobileAction(action);
        if (['left','right','down'].includes(action)) {
          repeatTimer = setInterval(() => mobileAction(action), action === 'down' ? 110 : 145);
        }
      };
      const release = () => { if (repeatTimer) clearInterval(repeatTimer); repeatTimer = null; };
      button.addEventListener('pointerdown', press);
      ['pointerup','pointercancel','pointerleave'].forEach(evt => button.addEventListener(evt, release));
      button.addEventListener('contextmenu', e => e.preventDefault());
    });
    document.getElementById('start-btn').addEventListener('click', startFromTouch);
    document.getElementById('restart-btn').addEventListener('click', restartGame);
  </script>
</body>
</html>
